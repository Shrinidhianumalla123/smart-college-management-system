<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile · Campus Admin</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><aside class="sidebar"><a class="brand" href="/dashboard"><span class="brand-mark">CA</span><span><b>CAMPUS ADMIN</b><small>COLLEGE ADMINISTRATION</small></span></a><div class="nav-label">WORKSPACE</div><a class="nav" href="/dashboard">▦ <span>Dashboard</span></a><a class="nav active" href="/profile">◉ <span>My profile</span></a><div class="sidebar-foot">STUDENT PORTAL<br><span>Smart College Management</span></div></aside><main class="main"><header class="topbar"><div><span class="crumb">CAMPUS / STUDENT PORTAL</span><h1>My academic profile</h1></div><form action="/logout" method="post"><button class="btn light">Sign out</button></form></header><section class="panel profile-card"><span class="eyebrow muted">STUDENT PROFILE</span><h2 th:text="${student.name}"></h2><div class="profile-grid"><div><small>ROLL NUMBER</small><strong th:text="${student.roll_no}"></strong></div><div><small>COURSE</small><strong th:text="${student.course}"></strong></div><div><small>MARKS / 100</small><strong th:text="${student.marks}"></strong></div><div><small>ATTENDANCE</small><strong th:text="${percentage + '%'}"></strong></div></div></section><section class="panel"><div class="panel-head"><h3>Attendance history</h3></div><div class="table-wrap"><table><thead><tr><th>DATE</th><th>STATUS</th></tr></thead><tbody><tr th:each="a : ${attendance}"><td th:text="${a.attendance_date}"></td><td th:text="${a.status}"></td></tr><tr th:if="${attendance.isEmpty()}"><td colspan="2" class="muted">No attendance records yet.</td></tr></tbody></table></div></section></main></div></body></html>
